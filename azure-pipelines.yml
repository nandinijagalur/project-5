# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- main

pool:
  vmImage: ubuntu-latest
variables:
    imageName: 'java-app'
    acrName: 'project5acr'
    tag: '$(Build.BuildId)'

stages:
  - stage: CI
    jobs:
      - job: Build_Test_Scan_Push
        steps:
          - checkout: self
          - task: JavaToolInstaller@1
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: Maven@4
            displayName: Build spring boot app
            inputs:
              mavenPomFile: 'spring_app_latest-master/pom.xml'  
              goals: 'clean package'  
              publishJUnitResults: true
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              javaHomeOption: 'JDKVersion'
              jdkVersionOption: '1.17'
              mavenVersionOption: 'Default'
          - task: CopyFiles@2
            displayName: 'Copy JAR File'
            inputs:
              SourceFolder: '$(System.DefaultWorkingDirectory)/spring_app_latest-master/target'
              Contents: '*.jar'
              TargetFolder: '$(Build.ArtifactStagingDirectory)'

          - task: PublishBuildArtifacts@1
            displayName: 'Publish build artifact'
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)'
              ArtifactName: 'drop'


